<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      :root {
        --bg: #1a1a1a;
        --fg: #e6e6e6;
        --muted: #8a8a8a;
        --accent: #7aa2f7;
        --line: #333;
      }
      body {
        margin: 0;
        width: 260px;
        padding: 14px;
        background: var(--bg);
        color: var(--fg);
        font: 13px/1.4 system-ui, sans-serif;
      }
      h1 {
        margin: 0;
        font-size: 14px;
      }
      .muted {
        color: var(--muted);
      }
      .swatches {
        display: grid;
        grid-template-columns: repeat(8, 1fr);
        gap: 4px;
        margin: 12px 0;
      }
      .swatches span {
        aspect-ratio: 1;
        border-radius: 4px;
        border: 1px solid var(--line);
      }
      label {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 8px 0;
        border-top: 1px solid var(--line);
      }
      input {
        accent-color: var(--accent);
      }
      .error {
        margin-top: 8px;
        color: #e06c75;
        word-break: break-word;
      }
      [hidden] {
        display: none;
      }
    </style>
  </head>
  <body>
    <h1 id="name">Omarchy Web Theme</h1>
    <div class="muted" id="mode">Waiting for theme…</div>
    <div class="swatches" id="swatches"></div>
    <label>Theme websites <input type="checkbox" id="enabled" /></label>
    <label><span>Theme <b id="host">this site</b></span> <input type="checkbox" id="site" /></label>
    <div class="error" id="error" hidden></div>
    <script src="popup.js"></script>
  </body>
</html>
